name: CI

# Checks every pull request and every push to main. Deploys are handled by
# Cloudflare's GitHub integration, which builds and publishes main on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Smoke test in a real browser
        run: npm test

      - name: Accounts test (local Worker and database, virtual passkeys)
        run: npm run test:accounts
