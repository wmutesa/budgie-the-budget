name: Logo refresh

# Checks every company logo in the directory each day and keeps the
# "Logo status" issue up to date with how many logos changed.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: logo-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the status issue and the last run's results
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create logo-status --color C9B8F5 --description "Daily logo check" 2>/dev/null || true
          number=$(gh issue list --label logo-status --state all --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo '{}' > previous.json
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body \
              | sed -n 's/.*<!-- logo-state \(.*\) -->.*/\1/p' > previous.json || true
            [ -s previous.json ] || echo '{}' > previous.json
          fi
      - name: Check logos
        run: |
          node scripts/check-logos.mjs previous.json > result.json
          node scripts/logo-report.mjs result.json > body.md
          sed '/<!-- logo-state/d' body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file body.md
            gh issue reopen "$NUMBER" 2>/dev/null || true
          else
            gh issue create --title "Logo status" --label logo-status --body-file body.md
          fi
          changed=$(node -e "const r=require('./result.json');console.log(r.firstRun?0:r.updated.length+r.found.length+r.added.length)")
          if [ "$changed" -gt 0 ] && [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$changed logo(s) updated on $(date -u +%Y-%m-%d). See the table above."
          fi
