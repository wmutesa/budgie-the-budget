<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Budgie · Local budget</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="wordmark-line">
      <span class="wordmark">Budgie</span>
      <span class="eyebrow" id="eyebrow"></span>
    </div>
    <nav class="jumps" aria-label="Jump to section">
      <a href="#overview">Overview</a><a href="#plan">Plan</a><a href="#accounts">Accounts</a>
      <a href="#goals">Goals</a><a href="#ledger">Ledger</a><a href="#ask">Assistant</a><a href="#set">Settings</a>
    </nav>
    <div class="tools">
      <form id="global-search" class="search" role="search">
        <input name="q" type="search" placeholder="Search transactions" aria-label="Search transactions" />
      </form>
      <span id="ai-pill" class="pill">AI · checking</span>
      <button class="ghost tiny" data-action="theme" title="Switch light and dark" aria-label="Switch light and dark theme">Theme</button>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="modal"><form id="modal-form" method="dialog"></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
