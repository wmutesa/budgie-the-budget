<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Ledgerline · Local budget</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><span class="mark">L</span><div><b>Ledgerline</b><small>local · private</small></div></div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="rail-foot"><span id="ai-pill" class="pill">AI · checking</span></div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1></div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <dialog id="modal"><form id="modal-form" method="dialog"></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
